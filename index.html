<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samandar Tishlikov | eDEX Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --bg-dark: #000000;
            --terminal-gray: #1a1a1a;
            --text-dim: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'VT323', monospace; }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-green);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* Fon effekti chiziqlari */
        .bg-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(0deg, transparent 95%, rgba(0, 255, 65, 0.05) 96%),
                              linear-gradient(90deg, transparent 95%, rgba(0, 255, 65, 0.05) 96%);
            background-size: 50px 50px;
            z-index: -2;
        }

        /* 1. INTERFEYS LAYOUTI (Rasm kabi joylashgan grafiklar) */
        .edex-layout {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .panel {
            position: absolute;
            background: rgba(10, 10, 10, 0.7);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            overflow: hidden;
        }

        /* Yuqori chap: Soat va Tizim */
        .panel-top-left { top: 15px; left: 15px; width: 25%; height: 20%; }
        /* Yuqori o'ng: Kiber globus (grafik o'rniga matn) */
        .panel-top-right { top: 15px; right: 15px; width: 20%; height: 35%; text-align: center; }
        /* Pastki: Klaviatura */
        .panel-bottom { bottom: 15px; left: 15%; width: 70%; height: 25%; }
        /* Chap: Tarmoq */
        .panel-left { top: 25%; left: 15px; width: 20%; height: 50%; }

        /* Oqayotgan kod effekti */
        .code-stream { color: rgba(0, 255, 65, 0.1); font-size: 10px; }

        /* 2. O'RTADAGI KIRISH TUGMASI */
        #welcome-overlay {
            text-align: center;
            z-index: 10;
            transition: 1.2s;
        }

        .cyber-btn {
            background: transparent;
            color: var(--neon-green);
            border: 2px solid var(--neon-green);
            padding: 20px 40px;
            font-size: 22px;
            cursor: pointer;
            letter-spacing: 3px;
            border-radius: 3px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .cyber-btn:hover {
            background: rgba(0, 255, 65, 0.2);
            box-shadow: 0 0 40px var(--neon-green);
        }

        /* 3. ASOSIY MA'LUMOTLAR OYNASI (Terminal o'rtasida) */
        #data-window {
            display: none;
            width: 90%; max-width: 500px;
            height: 70vh;
            background: var(--terminal-gray);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            position: absolute;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            transform: scale(0.8);
            transition: 1s cubic-bezier(0.19, 1, 0.22, 1);
            overflow-y: auto;
        }

        /* Terminal sarlavhasi */
        .term-header {
            border-bottom: 1px solid var(--neon-green);
            margin-bottom: 15px;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* Til Tanlash */
        .lang-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .lang-btn { background: #000; border: 1px solid var(--text-dim); color: #fff; padding: 4px 8px; font-size: 14px; border-radius: 3px; cursor: pointer; }
        .lang-btn.active { border-color: var(--neon-green); color: var(--neon-green); }

        /* Ma'lumot bloklari */
        .data-block { margin-bottom: 15px; }
        .data-label { color: var(--text-dim); font-size: 14px; text-transform: uppercase; }
        .data-val { color: #fff; font-size: 18px; font-weight: bold; }
        .data-icon { font-size: 20px; margin-right: 10px; color: var(--neon-green); }

        /* Tugmalar */
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
